[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/crew-sh/crew"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
libc = "0.2"
prost = "0.14"
prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
crew-proto = { path = "crates/crew-proto" }
crew-sys = { path = "crates/crew-sys", default-features = false }
crew-usher = { path = "crates/crew-usher" }
crew-usher-client = { path = "crates/crew-usher-client" }
crew-git = { path = "crates/crew-git" }
crew-ledger = { path = "crates/crew-ledger" }
crew-depot-config = { path = "crates/crew-depot-config" }
crew-depot = { path = "crates/crew-depot" }

[profile.release]
lto = "thin"
