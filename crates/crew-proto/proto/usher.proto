syntax = "proto3";
package crew.usher;

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_BUILD = 1;
  JOB_KIND_TEST = 2;
  JOB_KIND_HARNESS = 3;
  JOB_KIND_GAME = 4;
  JOB_KIND_BENCH = 5;
  JOB_KIND_LSP = 6;
  JOB_KIND_OTHER = 7;
}

// Zero weights mean "use the kind's default".
message Limits {
  optional uint64 mem_bytes = 1;
  uint32 cpu_weight = 2;
  uint32 io_weight = 3;
  optional uint32 cpus = 4;
}

message JobRequest {
  string id = 1;
  JobKind kind = 2;
  repeated string argv = 3;
  string cwd = 4;
  string project = 5;
  string agent = 6;
  Limits declared = 7;
  bool needs_display = 8;
  bool desktop = 9;
  // WAYLAND_DISPLAY, WAYLAND_SOCKET and DISPLAY as the client sees them.
  map<string, string> display_env = 10;
  // A re-submit after the usher went away: when the client first queued this id (unix ms). Zero for a first submit.
  uint64 queued_at_unix_ms = 11;
  // The usher owns the job: it keeps it queued and runs it itself, whether or not the client stays.
  bool detach = 12;
  // The client's environment (detached jobs only); the usher applies the grant on top of it.
  map<string, string> env = 13;
  // Where a detached job's stdout and stderr go; empty means a file under the usher's state directory.
  string log_path = 14;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_GRANTED = 1;
  DECISION_QUEUED = 2;
  DECISION_REFUSED = 3;
}

enum WaitingOn {
  WAITING_ON_UNSPECIFIED = 0;
  WAITING_ON_MEMORY = 1;
  WAITING_ON_CPU = 2;
  WAITING_ON_GAME_CAP = 3;
  WAITING_ON_OWNER_PRESENT = 4;
  WAITING_ON_DISK = 5;
  WAITING_ON_EXCLUSIVE = 6;
}

enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;
  REFUSAL_REASON_DISK_LOW = 1;
  REFUSAL_REASON_OVER_GAME_CAP = 2;
  REFUSAL_REASON_DISPLAY_FORBIDDEN = 3;
  REFUSAL_REASON_UNKNOWN_KIND = 4;
  // `crew cancel` removed the job while it was queued.
  REFUSAL_REASON_CANCELLED = 5;
  // The job's memory plus the memory kept free exceeds the machine's total, so it could never start.
  REFUSAL_REASON_TOO_LARGE = 6;
}

enum BuildPriority {
  BUILD_PRIORITY_UNSPECIFIED = 0;
  BUILD_PRIORITY_NORMAL = 1;
  // Yields to waiting normal-priority builds (mbx `scheduler.priority = "low"`).
  BUILD_PRIORITY_LOW = 2;
}

// What a granted build or test may spend in the compiler cache's shared pool.
message BuildGrant {
  BuildPriority priority = 1;
  // Most cores this build's compilers hold together; zero means no cap.
  uint32 compile_cpus = 2;
}

// Pool capacity a job that is no compiler holds while it runs (`mbx reserve`), so compilers make room.
message PoolReserve {
  string mbx_path = 1;
  uint32 cpus = 2;
  uint64 mem_bytes = 3;
}

message Grant {
  string job_id = 1;
  Limits limits = 2;
  string scope_name = 3;
  map<string, string> env_set = 4;
  repeated string env_unset = 5;
  BuildGrant build = 6;
  PoolReserve reserve = 7;
}

message Refusal {
  RefusalReason reason = 1;
  string detail = 2;
}

message Queued {
  WaitingOn waiting_on = 1;
  uint32 position = 2;
  uint64 queued_ms = 3;
  string detail = 4;
}

message Reply {
  Decision decision = 1;
  oneof outcome {
    Grant grant = 2;
    Refusal refusal = 3;
    Queued queued = 4;
  }
}

message JobDone {
  string job_id = 1;
  int32 exit_code = 2;
  uint64 wall_ms = 3;
  uint64 cpu_usec = 4;
  // Peak working set (anonymous, shared and kernel memory of the scope), sampled; page cache is not counted.
  uint64 peak_mem_bytes = 5;
  uint64 io_read_bytes = 6;
  uint64 io_write_bytes = 7;
  // peak_mem_bytes is a working-set peak; clients that predate it report memory.peak, page cache included.
  bool working_set = 8;
}

message Ack {
  bool ok = 1;
  string message = 2;
}

message TopRequest {}

message JobView {
  string id = 1;
  JobKind kind = 2;
  string agent = 3;
  string project = 4;
  string command = 5;
  uint64 expected_mem_bytes = 6;
  uint32 expected_cores_milli = 7;
  uint64 age_ms = 8;
  uint64 cpu_usec = 9;
  uint64 mem_bytes = 10;
  uint64 io_bytes = 11;
  WaitingOn waiting_on = 12;
}

message DiskView {
  string path = 1;
  uint64 free_bytes = 2;
  uint64 min_free_bytes = 3;
}

enum OwnerSource {
  OWNER_SOURCE_UNSPECIFIED = 0;
  OWNER_SOURCE_MANUAL = 1;
  OWNER_SOURCE_WAYLAND_IDLE = 2;
  // In OwnerSet: drop the manual override and follow idle detection.
  OWNER_SOURCE_AUTO = 3;
  // In MachineView: no idle detection and no manual override, owner assumed present.
  OWNER_SOURCE_DEFAULT = 4;
}

message MachineView {
  uint64 mem_total = 1;
  uint64 mem_available = 2;
  uint32 cpu_count = 3;
  double load1 = 4;
  double psi_cpu_some_avg10 = 5;
  double psi_mem_some_avg10 = 6;
  double psi_io_some_avg10 = 7;
  repeated DiskView disk = 8;
  bool owner_present = 9;
  OwnerSource owner_source = 10;
  double unmanaged_cpu_pct = 11;
  IdleWatcher idle_watcher = 12;
}

// How the usher's idle detection is doing; anything but WATCHING means the owner counts as present.
enum IdleWatcher {
  IDLE_WATCHER_UNSPECIFIED = 0;
  // The usher runs without idle detection (`crew owner here|away` only).
  IDLE_WATCHER_NOT_CONFIGURED = 1;
  IDLE_WATCHER_WATCHING = 2;
  // The subscription ended; the usher is retrying with backoff.
  IDLE_WATCHER_LOST = 3;
  // No subscription was ever made (no compositor, or it lacks the protocol); the usher keeps retrying.
  IDLE_WATCHER_UNAVAILABLE = 4;
}

enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;
  AGENT_KIND_CLAUDE = 1;
  AGENT_KIND_CODEX = 2;
}

enum AccountingSource {
  ACCOUNTING_SOURCE_UNSPECIFIED = 0;
  // Summed over the session's processes from /proc.
  ACCOUNTING_SOURCE_PROC = 1;
  // Read from a cgroup that holds only the session's processes.
  ACCOUNTING_SOURCE_CGROUP = 2;
}

// One agent session: a claude or codex process and its descendants. Observed, never changed.
message AgentView {
  // CREW_AGENT of the session's process, else "<kind>-<pid>".
  string name = 1;
  AgentKind kind = 2;
  uint32 pid = 3;
  string project = 4;
  string cwd = 5;
  uint32 processes = 6;
  uint64 cpu_usec = 7;
  uint32 cpu_milli = 8;
  uint64 mem_bytes = 9;
  uint64 io_read_bytes = 10;
  uint64 io_write_bytes = 11;
  string cgroup = 12;
  AccountingSource source = 13;
  uint64 age_ms = 14;
  // The session's name came from CREW_AGENT.
  bool named = 15;
  // The session has a controlling terminal: an owner's session.
  bool has_tty = 16;
  // Adoption could act on this session once its flags are on: named, no terminal, not protected.
  bool actionable = 17;
}

message ProjectView {
  string name = 1;
  string toplevel = 2;
  uint32 agents = 3;
  uint32 processes = 4;
  uint64 cpu_usec = 5;
  uint32 cpu_milli = 6;
  uint64 mem_bytes = 7;
  uint64 io_read_bytes = 8;
  uint64 io_write_bytes = 9;
  uint32 running_jobs = 10;
  uint32 queued_jobs = 11;
}

message TopReply {
  repeated JobView running = 1;
  repeated JobView queued = 2;
  MachineView machine = 3;
  repeated AgentView agents = 4;
  repeated ProjectView projects = 5;
}

enum WaitCondition {
  WAIT_CONDITION_UNSPECIFIED = 0;
  WAIT_CONDITION_QUEUE_EMPTY = 1;
  // The job with WaitRequest.job_id is running or has finished.
  WAIT_CONDITION_JOB_GRANTED = 2;
  WAIT_CONDITION_OWNER_AWAY = 3;
  // A detached job has finished (WaitReply.exit_code is its status); any other job counts as soon as it was granted.
  WAIT_CONDITION_JOB_EXIT = 4;
}

message WaitRequest {
  WaitCondition condition = 1;
  string job_id = 2;
  // Zero waits without a limit.
  uint64 timeout_ms = 3;
}

enum WaitOutcome {
  WAIT_OUTCOME_UNSPECIFIED = 0;
  WAIT_OUTCOME_SATISFIED = 1;
  WAIT_OUTCOME_TIMED_OUT = 2;
  WAIT_OUTCOME_REJECTED = 3;
  // The job was refused or its client left before it was granted.
  WAIT_OUTCOME_NEVER_GRANTED = 4;
  // A detached job started but ended without an exit status (cancelled while running, or its scope vanished).
  WAIT_OUTCOME_JOB_LOST = 5;
}

message WaitReply {
  WaitOutcome outcome = 1;
  WaitCondition condition = 2;
  string detail = 3;
  uint64 waited_ms = 4;
  // Set for WAIT_CONDITION_JOB_EXIT on a finished detached job.
  optional int32 exit_code = 5;
}

message OwnerSet {
  bool present = 1;
  OwnerSource source = 2;
}

message Envelope {
  oneof body {
    JobRequest job_request = 1;
    Reply reply = 2;
    JobDone job_done = 3;
    TopRequest top_request = 4;
    TopReply top_reply = 5;
    OwnerSet owner_set = 6;
    Ack ack = 7;
    WaitRequest wait_request = 8;
    WaitReply wait_reply = 9;
    DetachedAccepted detached_accepted = 10;
    JobsRequest jobs_request = 11;
    JobsReply jobs_reply = 12;
    CancelRequest cancel_request = 13;
    InsideJobRequest inside_job_request = 14;
  }
}

// Asks whether the caller runs inside the named running job; the answer comes from the pid the kernel reports.
message InsideJobRequest {
  string job_id = 1;
}

// The usher took a detached job: it is queued (or already running) and no longer needs the client.
message DetachedAccepted {
  string job_id = 1;
  string log_path = 2;
}

message JobsRequest {}

enum JobPhase {
  JOB_PHASE_UNSPECIFIED = 0;
  JOB_PHASE_QUEUED = 1;
  JOB_PHASE_RUNNING = 2;
  // Ran and reported an exit status.
  JOB_PHASE_EXITED = 3;
  // Never ran, or ran and was lost without a status; `reason` says why.
  JOB_PHASE_FAILED = 4;
  JOB_PHASE_CANCELLED = 5;
}

message JobSummary {
  string id = 1;
  JobKind kind = 2;
  string agent = 3;
  string project = 4;
  string command = 5;
  JobPhase phase = 6;
  // The usher owns this job (crew run --detach); otherwise a `crew run` client does.
  bool detached = 7;
  optional int32 exit_code = 8;
  string log_path = 9;
  // Why a failed or cancelled job ended, or what a queued one waits on.
  string reason = 10;
  WaitingOn waiting_on = 11;
  uint32 position = 12;
  uint64 queued_at_unix_ms = 13;
  uint64 started_at_unix_ms = 14;
  uint64 finished_at_unix_ms = 15;
}

message JobsReply {
  repeated JobSummary jobs = 1;
}

message CancelRequest {
  string job_id = 1;
}

// The state file of detached jobs (usher-jobs.pb): queued and running ones, then the recently finished.
message DetachedJob {
  JobRequest request = 1;
  JobPhase phase = 2;
  // First queued, in unix ms; the queue order and starvation clock of a restored job.
  uint64 queued_at_unix_ms = 3;
  uint64 started_at_unix_ms = 4;
  uint64 finished_at_unix_ms = 5;
  string scope_name = 6;
  Limits base_limits = 7;
  uint64 expected_mem_bytes = 8;
  uint32 expected_cores_milli = 9;
  string log_path = 10;
  // Where the job's wrapper writes the exit status.
  string status_path = 11;
  string tmpdir = 12;
  optional int32 exit_code = 13;
  string reason = 14;
  // A `crew run` job, not a detached one: a running one is kept so a restarted usher still counts its scope, a queued one so its client keeps its place.
  bool attached = 15;
  // The `crew run` process that holds an attached job, and its start time (clock ticks), so a restarted usher can tell when it died.
  uint32 client_pid = 16;
  uint64 client_start_ticks = 17;
}

message JobsFile {
  uint32 version = 1;
  repeated DetachedJob jobs = 2;
}

message SizeSample {
  uint64 peak_mem_bytes = 1;
  uint32 cores_milli = 2;
}

message SizeEntry {
  string key = 1;
  repeated SizeSample samples = 2;
  // When a run of this command last taught the usher something; zero in files from before keys expired.
  uint64 last_seen_unix_ms = 3;
}

message SizesFile {
  uint32 version = 1;
  repeated SizeEntry entries = 2;
}
